plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.3.21'
}

Properties properties = new Properties()
if (project.rootProject.file('local.properties').exists()) {
    properties.load(project.rootProject.file('local.properties').newDataInputStream())
}

android {
    namespace 'com.projectnabil.basic.compose'
    compileSdk 37

    defaultConfig {
        applicationId "com.projectnabil.basic.compose"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        compose true
    }

    signingConfigs {
        release {
            def keyFileStr = properties.getProperty('MY_KEY_FILENAME', '')
            if (keyFileStr != null && keyFileStr.trim() != '') {
                storeFile file(keyFileStr)
                storePassword properties.getProperty('MY_STORE_PASSWORD', '')
                keyAlias properties.getProperty('MY_KEY_ALIAS', '')
                keyPassword properties.getProperty('MY_KEY_PASSWORD', '')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2026.05.00')
    implementation composeBom

    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    
    debugImplementation 'androidx.compose.ui:ui-tooling'
}