plugins {
    id 'com.android.library' 
}

android {
    namespace 'com.projectnabil.basic.library'
    compileSdk 37

    defaultConfig {
        minSdk 24
        targetSdk 37
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}