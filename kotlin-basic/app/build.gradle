plugins {
    id 'com.android.application'
}

Properties properties = new Properties()
if (project.rootProject.file('local.properties').exists()) {
    properties.load(project.rootProject.file('local.properties').newDataInputStream())
}

android {
    namespace 'com.projectnabil.basic.kotlin'
    compileSdk 37

    defaultConfig {
        applicationId "com.projectnabil.basic.kotlin"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            def keyFileStr = properties.getProperty('MY_KEY_FILENAME', '')
            if (keyFileStr != null && keyFileStr.trim() != '') {
                storeFile file(keyFileStr)
                storePassword properties.getProperty('MY_STORE_PASSWORD', '')
                keyAlias properties.getProperty('MY_KEY_ALIAS', '')
                keyPassword properties.getProperty('MY_KEY_PASSWORD', '')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.0'
}