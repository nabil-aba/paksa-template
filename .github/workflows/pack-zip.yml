name: Pack All Template ZIPs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack semua folder jadi ZIP
        run: |
          mkdir -p dist
          for dir in */; do
            name="${dir%/}"
            zip -r "dist/${name}.zip" "$dir" \
              --exclude ".git/*" \
              --exclude ".github/*" \
              --exclude "*.zip"
            echo "Packed: dist/${name}.zip"
          done
          ls -lh dist/

      - name: Push semua ZIP ke paksa-core-rust/templates/
        env:
          PAKSA_CORE_TOKEN: ${{ secrets.PAKSA_CORE_TOKEN }}
        run: |
          git clone https://x-access-token:$PAKSA_CORE_TOKEN@github.com/nabil-aba/paksa-core-rust.git paksa-core-rust
          mkdir -p paksa-core-rust/templates
          cp dist/*.zip paksa-core-rust/templates/
          cd paksa-core-rust
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add templates/
          git diff --staged --quiet || (git commit -m "ci: update templates [skip ci]" && git push)

      - name: Trigger paksa-core-rust build
        env:
          PAKSA_CORE_TOKEN: ${{ secrets.PAKSA_CORE_TOKEN }}
        run: |
          curl -X POST \
            -H "Authorization: token $PAKSA_CORE_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/nabil-aba/paksa-core-rust/dispatches \
            -d '{"event_type":"templates-updated"}'