name: Pack All Template ZIPs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack semua folder jadi ZIP secara otomatis
        run: |
          mkdir -p dist
          for dir in */; do
            name="${dir%/}"
            
            # Lewati folder 'dist' agar tidak ikut diproses
            if [ "$name" = "dist" ]; then
              continue
            fi
            
            echo "Packing: $name"
            
            # git archive akan otomatis men-zip isi folder.
            # File sampah/build cache otomatis diabaikan tanpa perlu dideklarasikan satu per satu!
            git archive --format=zip -o "dist/${name}.zip" HEAD:"$name"
            
            echo "Packed: dist/${name}.zip"
          done
          ls -lh dist/

      - name: Push semua ZIP ke paksa-core-rust/templates/
        env:
          PAKSA_CORE_TOKEN: ${{ secrets.PAKSA_CORE_TOKEN }}
        run: |
          git clone https://x-access-token:$PAKSA_CORE_TOKEN@github.com/nabil-aba/paksa-core-rust.git paksa-core-rust
          mkdir -p paksa-core-rust/templates
          rm -f paksa-core-rust/templates/*.zip
          cp dist/*.zip paksa-core-rust/templates/
          cd paksa-core-rust
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/
          git diff --staged --quiet || (git commit -m "ci: update templates [skip ci]" && git push)

      - name: Push semua ZIP ke paksa/templates/
        env:
          PAKSA_CORE_TOKEN: ${{ secrets.PAKSA_CORE_TOKEN }}
        run: |
          git clone https://x-access-token:$PAKSA_CORE_TOKEN@github.com/nabil-aba/paksa.git paksa-dist
          mkdir -p paksa-dist/templates
          rm -f paksa-dist/templates/*.zip
          cp dist/*.zip paksa-dist/templates/
          cd paksa-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/
          git diff --staged --quiet || (git commit -m "ci: update templates [skip ci]" && git push)